<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IPTV Cinema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
<div class="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="logo">IPTV<span>Cinema</span></div>
    <form id="login-form" class="login-form">
      <input id="serverUrl" placeholder="Server URL" value="http://line.din-ott.com" />
      <input id="username" placeholder="Username" />
      <input id="password" type="password" placeholder="Password" />
      <button type="submit">Connect</button>
    </form>
  </header>

  <!-- STATUS BAR -->
  <div id="status" class="status-bar"></div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="live">LIVE TV</button>
    <button class="tab-btn" data-tab="movies">MOVIES</button>
    <button class="tab-btn" data-tab="series">SERIES</button>
  </div>

  <!-- MAIN LAYOUT -->
  <main class="main">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h3 id="sidebar-title">Categories</h3>
      <div id="sidebar-list" class="sidebar-list"></div>
    </aside>

    <!-- CONTENT AREA -->
    <section class="content-area">
      <div id="content-grid" class="content-grid"></div>
    </section>

  </main>

  <!-- VIDEO PLAYER -->
  <section class="player-section">
    <h2 id="current-title">Select something to play</h2>
    <video id="player" controls playsinline></video>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
